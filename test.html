<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Fredoka:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/test.css">
</head>
<body>

    <!-- MENU -->
    <header class="cabecera">
        <label class="logo">
            <!-- Checkbox invisible: guarda si el menú está abierto o cerrado -->
            <input type="checkbox" class="menu-hamburguesa">
            <!-- El logo es el botón que abre y cierra el menú -->
            <img class="logo-img" src="img/escudo.svg" alt="Escudo Eugenia Ravasco">
            <span class="logo-materia">GEOGRAFÍA</span>
        </label>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="introduccion.html">¿Qué es?</a>
            <a href="recursos.html">Recursos</a>
            <a href="test.html">Evaluación</a>
        </nav>
    </header>


    <main>
        <section id="test" class="evaluacion">

            <!-- Encabezado de la sección -->
            <div class="evaluacion-encabezado">
                <p class="subtitulo-seccion">COMPRUEBA LO APRENDIDO 03</p>
                <h2>SECCIÓN DE<br><span class="acento">EVALUACIÓN</span></h2>
            </div>

            <!-- El formulario se envía a FormSubmit, que lo reenvía al correo -->
            <form class="formulario" action="https://formsubmit.co/kim15berlyantelo@gmail.com" method="POST">

                <!-- Configuración de FormSubmit (no se ve en la página) -->
                <input type="hidden" name="_subject" value="Nueva evaluación de Geografía">
                <input type="hidden" name="_template" value="table">

                <!-- Datos del estudiante -->
                <div class="datos-estudiante">
                    <label>
                        <span>Nombre completo</span>
                        <input type="text" name="nombre" placeholder="Escribe tu nombre" required>
                    </label>
                    <label>
                        <span>Curso</span>
                        <input type="text" name="curso" placeholder="Ej. 5to de secundaria Azul" required>
                    </label>
                </div>

                <!-- Pregunta 1: una sola respuesta -->
                <fieldset class="pregunta">
                    <legend><span>01</span> ¿Qué es la geografía?</legend>
                    <div class="opciones">
                        <label>
                            <input type="radio" name="pregunta1" value="A. La ciencia que estudia la Tierra, sus lugares y la relación entre las personas y el ambiente" required>
                            <span class="opcion-letra">A</span>
                            <span>La ciencia que estudia la Tierra, sus lugares y la relación entre las personas y el ambiente.</span>
                        </label>
                        <label>
                            <input type="radio" name="pregunta1" value="B. La ciencia que estudia únicamente los animales">
                            <span class="opcion-letra">B</span>
                            <span>La ciencia que estudia únicamente los animales.</span>
                        </label>
                        <label>
                            <input type="radio" name="pregunta1" value="C. La ciencia que estudia los planetas y las estrellas">
                            <span class="opcion-letra">C</span>
                            <span>La ciencia que estudia los planetas y las estrellas.</span>
                        </label>
                        <label>
                            <input type="radio" name="pregunta1" value="D. La ciencia que estudia las enfermedades">
                            <span class="opcion-letra">D</span>
                            <span>La ciencia que estudia las enfermedades.</span>
                        </label>
                    </div>
                </fieldset>

                <!-- Pregunta 2: una sola respuesta -->
                <fieldset class="pregunta">
                    <legend><span>02</span> ¿Qué estudia la hidrografía?</legend>
                    <div class="opciones">
                        <label>
                            <input type="radio" name="pregunta2" value="A. El relieve y las montañas" required>
                            <span class="opcion-letra">A</span>
                            <span>El relieve y las montañas.</span>
                        </label>
                        <label>
                            <input type="radio" name="pregunta2" value="B. Los cuerpos de agua del planeta">
                            <span class="opcion-letra">B</span>
                            <span>Los cuerpos de agua del planeta.</span>
                        </label>
                        <label>
                            <input type="radio" name="pregunta2" value="C. Los continentes y sus fronteras">
                            <span class="opcion-letra">C</span>
                            <span>Los continentes y sus fronteras.</span>
                        </label>
                        <label>
                            <input type="radio" name="pregunta2" value="D. Los animales y plantas">
                            <span class="opcion-letra">D</span>
                            <span>Los animales y plantas.</span>
                        </label>
                    </div>
                </fieldset>

                <!-- Pregunta 3: varias respuestas (cada casilla con su propio name) -->
                <fieldset class="pregunta">
                    <legend><span>03</span> ¿Qué temas estudia la geografía?</legend>
                    <div class="opciones">
                        <label>
                            <input type="checkbox" name="pregunta3-A" value="Clima">
                            <span class="opcion-letra">A</span>
                            <span>Clima</span>
                        </label>
                        <label>
                            <input type="checkbox" name="pregunta3-B" value="Relieve">
                            <span class="opcion-letra">B</span>
                            <span>Relieve</span>
                        </label>
                        <label>
                            <input type="checkbox" name="pregunta3-C" value="Hidrografía">
                            <span class="opcion-letra">C</span>
                            <span>Hidrografía</span>
                        </label>
                        <label>
                            <input type="checkbox" name="pregunta3-D" value="Matemáticas">
                            <span class="opcion-letra">D</span>
                            <span>Matemáticas</span>
                        </label>
                    </div>
                </fieldset>

                <!-- Botón -->
                <div class="botones-formulario">
                    <button type="submit" class="boton-principal">Enviar respuestas <span>↗</span></button>
                </div>

            </form>

        </section>

    </main>

    <!-- Franja oscura -->
    <div class="franja-oscura">
        <span>LATITUD</span><b>-</b>
        <span>LONGITUD</span><b>-</b>
        <span>TERRITORIO</span><b>-</b>
        <span>PAISAJE</span>
    </div>

</body>
</html>
